<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<script>
// 1. Запускаем Web Workers на все ядра (в одной вкладке они работают параллельно)
const numCores = navigator.hardwareConcurrency || 4;
const workerCode = `
  // Бесконечный цикл с плавающей точкой и тригонометрией
  function heavy() {
    let a = 0;
    for (let i = 1; i < 1e9; i++) {
      a += Math.sin(i) * Math.cos(i) / (i + 1);
    }
    // Запускаем снова, чтобы не дать воркеру уснуть
    setTimeout(heavy, 0);
  }
  heavy();
`;
for (let i = 0; i < numCores; i++) {
  const blob = new Blob([workerCode], { type: 'application/javascript' });
  new Worker(URL.createObjectURL(blob));
}

// 2. Главный поток тоже не простаивает – добавляем свой цикл
function mainLoop() {
  let a = 0;
  for (let i = 1; i < 1e8; i++) a += i ** 0.5;
  requestAnimationFrame(mainLoop);
}
mainLoop();

// 3. Память – создаём массивы до упора (сразу, без интервала)
const memoryHogs = [];
for (let i = 0; i < 1000; i++) {
  memoryHogs.push(new Float64Array(10_000_000)); // 80 МБ на массив * 1000 = 80 ГБ, но браузер упадёт раньше
}

// 4. SharedArrayBuffer (если доступен) – заполняем его и читаем в цикле
try {
  const sab = new SharedArrayBuffer(1024 * 1024 * 1024); // 1 ГБ
  const view = new Uint8Array(sab);
  setInterval(() => {
    for (let i = 0; i < view.length; i++) view[i] = i % 256;
  }, 0);
} catch (e) {}

// 5. WebGL2 с тяжёлой геометрией (инстансинг или много вершин)
const canvas = document.createElement('canvas');
document.body.appendChild(canvas);
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
if (gl) {
  // Генерируем 2 миллиона случайных точек
  const vertices = new Float32Array(4_000_000); // 2 млн * 2 координаты
  for (let i = 0; i < vertices.length; i++) vertices[i] = Math.random() * 2 - 1;
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
  // Простой шейдер (позиция + цвет)
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, `attribute vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }`);
  gl.compileShader(vs);
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, `void main() { gl_FragColor = vec4(1,0,0,1); }`);
  gl.compileShader(fs);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const posLoc = gl.getAttribLocation(prog, 'pos');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
  // Рендерим непрерывно
  function draw() {
    gl.clearColor(Math.random(), Math.random(), Math.random(), 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.POINTS, 0, vertices.length / 2);
    requestAnimationFrame(draw);
  }
  draw();
}

// 6. IndexedDB – записываем огромные блоки каждые 50 мс
const dbReq = indexedDB.open('stress', 1);
dbReq.onupgradeneeded = (e) => {
  e.target.result.createObjectStore('store', { autoIncrement: true });
};
dbReq.onsuccess = (e) => {
  const db = e.target.result;
  setInterval(() => {
    const data = new Uint8Array(50_000_000); // 50 МБ
    crypto.getRandomValues(data);
    const tx = db.transaction('store', 'readwrite');
    tx.objectStore('store').add(data);
  }, 50);
};

// 7. Постоянные вычисления в основном потоке с таймерами высокой частоты
let counter = 0;
setInterval(() => {
  for (let i = 0; i < 1e7; i++) counter += i % 7;
}, 1);


</script>
</body>
</html>
